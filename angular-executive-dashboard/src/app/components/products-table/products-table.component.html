<div class="table-container">
  <h3>Top Products</h3>
  <table mat-table [dataSource]="tableData" class="products-table">
    <!-- Product Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <!-- Units Sold Column -->
    <ng-container matColumnDef="sales">
      <th mat-header-cell *matHeaderCellDef>Units Sold</th>
      <td mat-cell *matCellDef="let element">{{ formatNumber(element.sales) }}</td>
    </ng-container>

    <!-- Revenue Column -->
    <ng-container matColumnDef="revenue">
      <th mat-header-cell *matHeaderCellDef>Revenue</th>
      <td mat-cell *matCellDef="let element">{{ formatCurrency(element.revenue) }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
